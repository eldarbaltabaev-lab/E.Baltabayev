<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моё Портфолио — Доска разработчика</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
  <header>
    <h1>💻 E.Baltabayev</h1>
    <div>
      <button class="btn btn-cancel" id="auth-btn" onclick="toggleAuth()">Войти</button>
      <button class="btn" id="add-btn" onclick="openModal()">+ Новый проект</button>
      
    </div>
  </header>

    <div class="board">
      <!-- Колонка 1: Идеи -->
      <div
        class="column"
        data-status="idea"
        ondragover="allowDrop(event)"
        ondragleave="dragLeave(event)"
        ondrop="drop(event)"
      >
        <div class="column-header">
          💡 Идеи <span class="count" id="count-idea">0</span>
        </div>
        <div class="cards-container" id="list-idea"></div>
      </div>

      <!-- Колонка 2: В разработке -->
      <div
        class="column"
        data-status="dev"
        ondragover="allowDrop(event)"
        ondragleave="dragLeave(event)"
        ondrop="drop(event)"
      >
        <div class="column-header">
          ⚙️ В разработке <span class="count" id="count-dev">0</span>
        </div>
        <div class="cards-container" id="list-dev"></div>
      </div>

      <!-- Колонка 3: Тестирование -->
      <div
        class="column"
        data-status="test"
        ondragover="allowDrop(event)"
        ondragleave="dragLeave(event)"
        ondrop="drop(event)"
      >
        <div class="column-header">
          🧪 Тестирование <span class="count" id="count-test">0</span>
        </div>
        <div class="cards-container" id="list-test"></div>
      </div>

      <!-- Колонка 4: Готово -->
      <div
        class="column"
        data-status="done"
        ondragover="allowDrop(event)"
        ondragleave="dragLeave(event)"
        ondrop="drop(event)"
      >
        <div class="column-header">
          ✅ Готово <span class="count" id="count-done">0</span>
        </div>
        <div class="cards-container" id="list-done"></div>
      </div>
    </div>
    <!-- Секция для идей гостей -->
      <div id="guest-idea-section" style="display: none; max-width: 800px; margin: 40px auto 20px auto; padding: 24px; background: rgba(24, 24, 27, 0.8); border: 1px solid var(--neon-dev); border-radius: 12px; box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);">
        <h2 style="margin-bottom: 16px; color: var(--text); text-shadow: 0 0 10px rgba(6,182,212,0.5);">💡 Есть идея для сайта?</h2>
        <textarea id="guest-idea-input" rows="3" placeholder="Напишите, что бы вы хотели добавить или улучшить..." style="width: 100%; padding: 16px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 16px; resize: vertical;"></textarea>
        <button class="btn" onclick="submitGuestIdea()" style="width: 100%; padding: 14px; font-size: 16px;">Отправить предложение</button>
      </div>

    <!-- Модальное окно добавления (только для Админа) -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    
    <div id="admin-form" style="display: none;">
      <h2>Добавить проект</h2>
      <div class="form-group">
        <label>Название проекта</label>
        <input type="text" id="input-title" placeholder="Например: Turan Camp">
      </div>
      <div class="form-group">
        <label>Краткое описание</label>
        <textarea id="input-desc" rows="2" placeholder="Что это за проект..."></textarea>
      </div>
      <div class="form-group">
        <label>Ссылка на проект (URL)</label>
        <input type="url" id="input-link" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Статус</label>
        <select id="input-status">
          <option value="idea">💡 Идея</option>
          <option value="dev" selected>⚙️ В разработке</option>
          <option value="test">🧪 Тестирование</option>
          <option value="done">✅ Готово</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn" onclick="addTaskAdmin()">Создать</button>
      </div>
    </div>

  </div>
</div>
      
      <!-- ФОРМА ДЛЯ АДМИНА -->
      <div id="admin-form" style="display: none;">
        <h2>Добавить проект</h2>
        <div class="form-group">
          <label>Название проекта</label>
          <input type="text" id="input-title" placeholder="Например: Turan Camp">
        </div>
        <div class="form-group">
          <label>Краткое описание</label>
          <textarea id="input-desc" rows="2" placeholder="Что это за проект..."></textarea>
        </div>
        <div class="form-group">
          <label>Ссылка на проект (URL)</label>
          <input type="url" id="input-link" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Статус</label>
          <select id="input-status">
            <option value="idea">💡 Идея</option>
            <option value="dev" selected>⚙️ В разработке</option>
            <option value="test">🧪 Тестирование</option>
            <option value="done">✅ Готово</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
          <button class="btn" onclick="addTaskAdmin()">Создать</button>
        </div>
      </div>
  

  
    </div>
  </div>

    <!-- Важно: type="module" нужен для работы Firebase -->
    <script type="module" src="script.js"></script>
  </body>
</html>
