<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b1a">
<title>Доска разработчика · E.Baltabayev</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>
<svg class="mount" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path d="M0 320V250l140-40 120 30 160-60 150 50 180-40 170 50 180-30 140 40v120z" fill="#101c45"/>
  <path d="M470 320L640 120l60-20 60 20L930 320z" fill="#16255a"/>
  <path d="M600 160l40-40 60-20 60 20 40 40-22-8-18 14-22-12-20 14-20-14-22 12-18-14z" fill="#f4f7ff"/>
  <path d="M0 320V280l180-30 200 24 240-20 220 26 220-24 180 22v82z" fill="#0a1233"/>
  <g fill="#0a1233"><path d="M1180 320V200h14v120zM1250 320V200h14v120z"/><path d="M1150 196q65-26 130-0l14-18q-80-24-158 0z"/><rect x="1166" y="214" width="112" height="8"/></g>
  <g fill="#c8102e" opacity=".9"><path d="M1180 320V200h14v120zM1250 320V200h14v120z"/><path d="M1150 196q65-26 130 0l14-18q-80-24-158 0z"/><rect x="1166" y="214" width="112" height="8"/></g>
</svg>

<header>
  <div class="logo">
    <span class="logo-ic" aria-hidden="true">冬</span>
    <div><h1>E.Baltabayev</h1><p class="sub">開発ボード · доска проектов</p></div>
  </div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Поиск по проектам…" oninput="setFilter(this.value)" aria-label="Поиск">
    <button class="btn ghost" id="auth-btn" onclick="toggleAuth()">Войти</button>
    <button class="btn" id="add-btn" onclick="openModal()">＋ Новый проект</button>
  </div>
</header>

<section class="prog" aria-label="Прогресс">
  <span class="prog-l"><span class="jp">進捗</span> <b id="done-n">0</b> из <b id="all-n">0</b></span>
  <div class="prog-t"><div class="prog-f" id="prog-f"></div></div>
  <span class="prog-p" id="prog-p">0%</span>
</section>

<main class="board">
  <div class="column" data-status="idea" data-k="案" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
    <div class="column-header"><span><i class="kj">案</i>Идеи</span><span class="count" id="count-idea">0</span></div>
    <div class="cards-container" id="list-idea"></div>
  </div>
  <div class="column" data-status="dev" data-k="作" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
    <div class="column-header"><span><i class="kj">作</i>В разработке</span><span class="count" id="count-dev">0</span></div>
    <div class="cards-container" id="list-dev"></div>
  </div>
  <div class="column" data-status="test" data-k="試" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
    <div class="column-header"><span><i class="kj">試</i>Тестирование</span><span class="count" id="count-test">0</span></div>
    <div class="cards-container" id="list-test"></div>
  </div>
  <div class="column" data-status="done" data-k="完" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
    <div class="column-header"><span><i class="kj">完</i>Готово</span><span class="count" id="count-done">0</span></div>
    <div class="cards-container" id="list-done"></div>
  </div>
</main>

<section id="guest-idea-section" class="guest" hidden>
  <h2><span class="jp">案</span> Есть идея для сайта?</h2>
  <textarea id="guest-idea-input" rows="3" placeholder="Напишите, что бы вы хотели добавить или улучшить…"></textarea>
  <button class="btn" onclick="submitGuestIdea()">Отправить предложение</button>
</section>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div id="admin-form" style="display:none">
      <h2>Добавить проект</h2>
      <div class="form-group"><label>Название проекта</label><input type="text" id="input-title" placeholder="Например: Turan Camp"></div>
      <div class="form-group"><label>Краткое описание</label><textarea id="input-desc" rows="2" placeholder="Что это за проект…"></textarea></div>
      <div class="form-group"><label>Ссылка на проект (URL)</label><input type="url" id="input-link" placeholder="https://..."></div>
      <div class="form-group"><label>Статус</label>
        <select id="input-status">
          <option value="idea">💡 Идея</option>
          <option value="dev" selected>⚙️ В разработке</option>
          <option value="test">🧪 Тестирование</option>
          <option value="done">✅ Готово</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Отмена</button>
        <button class="btn" onclick="addTaskAdmin()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-auth">
  <div class="modal">
    <h2>Вход для администратора</h2>
    <div class="form-group"><label>Email</label><input type="email" id="auth-email" placeholder="admin@turan.kz"></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="auth-pass" placeholder="••••••••"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeAuthModal()">Отмена</button>
      <button class="btn" onclick="login()">Войти</button>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
